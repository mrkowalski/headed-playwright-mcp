services:
  playwright-mcp:
    build:
      context: .
      args:
        PLAYWRIGHT_MCP_VERSION: ${PLAYWRIGHT_MCP_VERSION:?set PLAYWRIGHT_MCP_VERSION in .env}
    image: local/playwright-mcp:${PLAYWRIGHT_MCP_VERSION}
    hostname: playwright-mcp
    init: true # signal handling / zombie reaping for xvfb-run + chromium
    restart: unless-stopped
    shm_size: 1gb # headed Chromium crashes with Docker's default 64 MB /dev/shm
    ports:
      - "127.0.0.1:8931:8931"
    volumes:
      - ./config.json:/config/config.json:ro
      - pw-profile:/home/node/profile   # cookies, etc.
      - type: bind # snapshots, screenshots
        source: ./browser_output
        target: /home/node/browser_output
        bind:
          create_host_path: false # fail instead of creating a root-owned dir the node user can't write to

volumes:
  pw-profile:
    name: headed-playwright-mcp_pw-profile # pinned: survives renaming/moving the project dir
